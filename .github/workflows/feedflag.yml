name: feedflag

# Scheduled every 3h (8 runs/day ≈ 1,400 Actions min/mo — inside the free tier
# at typical runtimes). Pay-per-result Apify + dedupe keeps API cost ~cents/run
# (verified live). FEAT-002b tunes cadence; Phase-4 graduation path is Lambda
# (see TECHNICAL_DESIGN.md).
#
# `data/` is pipeline state; committed back at end of each run so the next
# run doesn't re-pay for captioning. Whitelisted files ONLY — never
# `git add -f data` (machine-token.sql lives in data/).

on:
  schedule:
    # Meal-time + poll-close runs (GitHub cron is UTC).
    # Local times shown for DST (EDT/CDT/PDT, through Nov 1 2026).
    # NOTE: DST ends Nov 1 — election day is Nov 3. After that these run an
    # hour EARLY local; bump each entry +1 UTC before election day.
    # Same run-count as the old 0 */3 * * * (8/day) — cost unchanged.
    - cron: "0 16 * * *" # 12:00 ET lunch
    - cron: "0 17 * * *" # 12:00 CT lunch (11:00 PT)
    - cron: "0 19 * * *" # 12:00 PT lunch
    - cron: "0 21 * * *" # 17:00 ET after work
    - cron: "0 22 * * *" # 17:00 CT after work (18:00 ET)
    - cron: "0 23 * * *" # 19:00 ET poll close (7pm, typical)
    - cron: "0 0 * * *"  # 19:00 CT poll close + 17:00 PT after work
    - cron: "0 2 * * *"  # 19:00 PT poll close
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: feedflag
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm start
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PIZZABASE_API_URL: https://base.polls.pizza
          PIZZABASE_API_KEY: ${{ secrets.PIZZABASE_API_KEY }}
          JEV_MODEL: typesafe/jev-router
          SITE_REPORTS_MAX: "50"
          FLAG_CONFIDENCE: "0.7"
          MAX_POSTS_PER_RUN: "40"
      - name: Extract gov wait times
        env:
          WAIT_TIME_SOURCES: ./config/govt-sources.jsonl
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_VOLS_WEBHOOK_URL: ${{ secrets.SLACK_VOLS_WEBHOOK_URL }}
        run: npx tsx scripts/extract-wait-times.ts
      - name: Post findings digest
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS_ISSUE: "5"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # ONE digest per day (glanceable assessment): posts on the 02:00 UTC
          # run (US day complete → lands for morning coffee) + manual dispatch.
          # Other runs post flags only (via npm start notifier) — no digest noise.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "02" ]; then
            echo "digest skipped — posts daily at 02:00 UTC (this run: flags only)"
            exit 0
          fi
          npx tsx scripts/digest.ts --hours 26 > /tmp/digest.md
          npx tsx scripts/extract-wait-times.ts --report-only >> /tmp/digest.md
          COMMENT_URL=$(gh issue comment "$FINDINGS_ISSUE" --body-file /tmp/digest.md)
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            npx tsx scripts/digest.ts --hours 26 --slack > /tmp/slack.json
            jq --arg d "$COMMENT_URL" '.text += "\nDetails: " + $d' /tmp/slack.json > /tmp/slack-payload.json
            curl -s --max-time 15 -o /dev/null -w "slack post: %{http_code}\n" -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/slack-payload.json \
              "$SLACK_WEBHOOK_URL" || echo "slack post failed (non-fatal)"
          fi
      - name: Persist pipeline state
        run: |
          changed=""
          for f in data/seen.json data/flagged.jsonl data/observations.jsonl data/reports-sync.json data/labels.jsonl data/govt-readings.json; do
            [ -f "$f" ] && changed="$changed $f"
          done
          if [ -n "$changed" ]; then
            git config user.name "feedflag-bot"
            git config user.email "feedflag-bot@users.noreply.github.com"
            git add -f -- $changed
            git commit -m "chore(data): feedflag run state [skip ci]"
            git push
          fi