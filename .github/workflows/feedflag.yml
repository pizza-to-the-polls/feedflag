name: feedflag

# Manual dispatch only for now. Stage 1 (FEAT-002b) re-enables the schedule
# once cost telemetry is tuned — enabling the cron with live secrets below
# would otherwise start ~48 paid Apify/OpenRouter runs per day.
# `data/seen.json` is the dedupe state; we commit it back at the end of each
# run so the next run doesn't re-pay for captioning the same posts.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feedflag
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm start
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          PIZZABASE_API_URL: https://base.polls.pizza
          PIZZABASE_API_KEY: ${{ secrets.PIZZABASE_API_KEY }}
          ZAPIER_CATCH_URL: ${{ secrets.ZAPIER_CATCH_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JEV_MODEL: typesafe/jev-router
          SITE_REPORTS_MAX: "50"
          FLAG_CONFIDENCE: "0.7"
          MAX_POSTS_PER_RUN: "40"
      - name: Persist dedupe state
        # Whitelist ONLY pipeline state files — never `git add -f data`,
        # which would sweep machine-token files into the repo.
        run: |
          changed=""
          for f in data/seen.json data/flagged.jsonl data/observations.jsonl data/reports-sync.json; do
            [ -f "$f" ] && changed="$changed $f"
          done
          if [ -n "$changed" ]; then
            git config user.name "feedflag-bot"
            git config user.email "feedflag-bot@users.noreply.github.com"
            git add -f -- $changed
            git commit -m "chore(data): feedflag run state [skip ci]"
            git push
          fi