name: Test

# House pattern (pizzabase/polls.pizza): ONE required check named `test`.
# Runs the full quality stack in one job — prettier → lint → tsc → tests —
# plus feedflag-specific gates (workflow integrity, secret scan, schedule
# sanity), all inside the same job so agents only need one green check.
# No secrets reach PR context — a PR cannot exfiltrate what the job lacks.

on:
  pull_request:
    paths-ignore:
      - "data/**"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version
        id: read_version
        run: echo "NODE_VER=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.read_version.outputs.NODE_VER }}
          cache: npm

      - run: npm ci

      - name: Workflow integrity gate (no workflow edits via PR)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" -- .github/workflows/ | grep -q .; then
            echo "::error::PR modifies .github/workflows/ — workflow changes are human-direct (never agent PRs). Close this PR; workflow changes go through a branch the human pushes."
            exit 1
          fi
          echo "no workflow changes ✓"

      - name: Secret pattern scan (full diff)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          PATTERNS='(xox[bpars]-[A-Za-z0-9-]{10,}|sk-or-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9_-]{20,}|apify_api_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|hooks\.slack\.com/services/[A-Za-z0-9/]+|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)'
          if git diff "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" -- . ':(exclude)data/*' | grep -E "$PATTERNS"; then
            echo "::error::Secret-shaped string in diff — rotate if real, push again."
            exit 1
          fi
          echo "no secrets in diff ✓"

      - name: YAML parse (all workflows)
        run: |
          rc=0
          for f in .github/workflows/*.yml; do
            npx --yes js-yaml "$f" > /dev/null || rc=1
          done
          [ "$rc" = 0 ] && echo "workflows parse ✓" || exit 1

      - name: Format check (prettier)
        run: npx --yes prettier --check "src/**/*.ts" "scripts/**/*.ts"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Cron/regression tests
        run: npm test

      - name: Schedule coverage sanity (election-day + govwatch windows)
        run: |
          grep -q '11-56/15' .github/workflows/feedflag-electionday.yml
          grep -q '/30' .github/workflows/feedflag-govwatch.yml
          echo "schedule coverage ✓"