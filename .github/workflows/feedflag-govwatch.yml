name: feedflag-govwatch

# GOV WAIT-TIMES — extraction-only, every 30 min around the clock.
# County trackers update continuously during voting (Clark stamps Last_Refresh
# through the day), not just at meal times. REST pulls are free; vision
# fallback ~$0.005/source/run → ~$1-3/day total.
#
# Shares the concurrency group with the election-day hot workflow so the two
# never race the data/govt-readings.json state commit (queue, not cancel).
# On Nov 2-4 the hot workflow runs every 15 min anyway.
#
# ISSUE #20 (2026-10-28): this workflow runs CODE FROM MAIN. The `data`
# branch is a state store, not a deploy channel — until 2026-10-28 it
# checked out `ref: data` and executed scripts/ from it, but the branch's
# code tree had lagged main since 2026-10-24 (pre-gate), so every backup run
# bypassed the issue-#12 freshness/hours gates and re-posted frozen Clark NV
# waits at 95% confidence. Now: code from main, state files overlaid from
# refs/heads/data at boot, and state pushed back as state-only commits
# (ops/state-push.sh) that can never carry code.

on:
  schedule:
    - cron: "13-58/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feedflag-gov
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Code ALWAYS from main (issue #20) — see the header note.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore state from the data branch (state files only)
        run: |
          git fetch -q origin refs/heads/data || { echo "no data branch yet — starting from empty state"; exit 0; }
          for f in data/govt-readings.json data/observations.jsonl; do
            git checkout -q FETCH_HEAD -- "$f" 2>/dev/null || echo "no $f on data branch yet — starting fresh"
          done
          # the per-file checkout staged the restored blobs; unstage them —
          # the working-tree copies are what the extraction scripts read/update
          git reset -q -- data 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract gov wait times
        env:
          WAIT_TIME_SOURCES: ./config/govt-sources.jsonl
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_VOLS_WEBHOOK_URL: ${{ secrets.SLACK_VOLS_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_FLAG_CHANNELS: ${{ secrets.SLACK_FLAG_CHANNELS }}
        run: npx tsx scripts/extract-wait-times.ts
      - name: Emit observations to pizzabase DB
        env:
          PIZZABASE_API_URL: ${{ secrets.PIZZABASE_API_URL }}
          PIZZABASE_API_KEY: ${{ secrets.PIZZABASE_API_KEY }}
        run: npx tsx scripts/emit-to-db.ts --hours 26 || echo "emit skipped (non-fatal)"
      - name: Collect Slack reactions
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_FLAG_CHANNELS: ${{ secrets.SLACK_FLAG_CHANNELS }}
        run: npx tsx scripts/collect-reactions.ts || echo "reaction collection skipped"
      - name: Persist extraction state (state-only commit to refs/heads/data)
        run: |
          changed=""
          for f in data/govt-readings.json data/observations.jsonl; do
            [ -f "$f" ] && changed="$changed $f"
          done
          if [ -z "$changed" ]; then
            echo "no state files — nothing to persist"
            exit 0
          fi
          # Issue #20: ops/state-push.sh builds a state-only commit with git
          # plumbing (temp index + commit-tree) on top of the data-branch tip,
          # so no code from this (main) checkout ever rides onto the data
          # branch, and no working-tree rebase is needed. Race-safe via retry.
          bash ops/state-push.sh -m "chore(data): govwatch extraction state [skip ci]" $changed
  alert:
    needs: extract
    if: always() && needs.extract.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Slack alert on failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PAYLOAD="{\"text\":\":rotating_light: feedflag workflow '${GITHUB_WORKFLOW}' FAILED (scheduled run) — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Actions log>. Watchdog re-checks DB freshness on its next run.\"}"
          curl -s -X POST -H 'content-type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
