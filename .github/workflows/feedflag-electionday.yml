name: feedflag-electionday

# ELECTION-DAY HOT MODE — 15-minute extraction of every seeded gov source.
# Runs all month but skips in seconds unless the date matches (guard output
# gates every step; nothing past the guard runs out of window — npm ci,
# screenshots, LLM calls all skipped). Cost when live: ~8 screenshots +
# flash-lite per pass ≈ $0.03 × 96 passes/day ≈ $3/day — the plan's
# "top sources every 15 min" scaled to our 8-source pilot.
#
# NOTE (DST): after Nov 1 2026 the meal-time crons in feedflag.yml fire an
# hour EARLY local — this workflow covers Nov 2-4 around the clock so poll
# close (ET/CT/PT) is inside its window regardless.
#
# ISSUE #20 (2026-10-28): this workflow runs CODE FROM MAIN. The `data`
# branch is a state store, not a deploy channel — executing scripts/ from it
# ran pre-gate code (branch had lagged main since 2026-10-24) and re-posted
# frozen Clark NV waits at 95% confidence. Code from main, state files
# overlaid from refs/heads/data at boot, state-only pushes (ops/state-push.sh).

on:
  schedule:
    - cron: "11-56/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # shared with govwatch: queue, never race the state commit
  group: feedflag-gov
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Date guard (live only Nov 2-4 2026)
        id: guard
        run: |
          if [[ "$(date -u +%Y-%m-%d)" =~ 2026-11-0[234] ]]; then
            echo "hot=true" >> "$GITHUB_OUTPUT"
            echo "election-day window: HOT"
          else
            echo "hot=false" >> "$GITHUB_OUTPUT"
            echo "not in window — skipping (no steps run past guard)"
          fi
      # Code ALWAYS from main (issue #20) — see the header note.
      - uses: actions/checkout@v4
        with:
          ref: main
        if: steps.guard.outputs.hot == 'true'
      - name: Restore state from the data branch (state files only)
        if: steps.guard.outputs.hot == 'true'
        run: |
          git fetch -q origin refs/heads/data || { echo "no data branch yet — starting from empty state"; exit 0; }
          for f in data/govt-readings.json data/observations.jsonl; do
            git checkout -q FETCH_HEAD -- "$f" 2>/dev/null || echo "no $f on data branch yet — starting fresh"
          done
          # the per-file checkout staged the restored blobs; unstage them —
          # the working-tree copies are what the extraction scripts read/update
          git reset -q -- data 2>/dev/null || true
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.hot == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.hot == 'true'
      - name: Extract gov wait times (hot)
        if: steps.guard.outputs.hot == 'true'
        env:
          WAIT_TIME_SOURCES: ./config/govt-sources.jsonl
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_VOLS_WEBHOOK_URL: ${{ secrets.SLACK_VOLS_WEBHOOK_URL }}
        run: npx tsx scripts/extract-wait-times.ts
      - name: Emit observations to pizzabase DB
        env:
          PIZZABASE_API_URL: ${{ secrets.PIZZABASE_API_URL }}
          PIZZABASE_API_KEY: ${{ secrets.PIZZABASE_API_KEY }}
        run: npx tsx scripts/emit-to-db.ts --hours 26 || echo "emit skipped (non-fatal)"
      - name: Persist extraction state (state-only commit to refs/heads/data)
        if: steps.guard.outputs.hot == 'true'
        run: |
          changed=""
          for f in data/govt-readings.json data/observations.jsonl; do
            [ -f "$f" ] && changed="$changed $f"
          done
          if [ -z "$changed" ]; then
            echo "no state files — nothing to persist"
            exit 0
          fi
          # Issue #20: ops/state-push.sh builds a state-only commit with git
          # plumbing (temp index + commit-tree) on top of the data-branch tip,
          # so no code from this (main) checkout ever rides onto the data
          # branch, and no working-tree rebase is needed. Race-safe via retry.
          bash ops/state-push.sh -m "chore(data): election-day hot extraction [skip ci]" $changed
  alert:
    needs: hot
    if: always() && needs.hot.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Slack alert on failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PAYLOAD="{\"text\":\":rotating_light: feedflag workflow '${GITHUB_WORKFLOW}' FAILED (scheduled run) — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Actions log>. Watchdog re-checks DB freshness on its next run.\"}"
          curl -s -X POST -H 'content-type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
